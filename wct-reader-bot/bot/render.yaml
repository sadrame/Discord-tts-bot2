services:
  - type: web
    name: wct-reader-bot
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_LOG_CHANNEL_ID   # optional: channel that logs read requests
        sync: false
