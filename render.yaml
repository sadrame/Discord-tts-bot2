services:
  - type: web
    name: wct-reader-bot
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_LOG_CHANNEL_ID   # optional: channel that logs read requests
        sync: false
      - key: UPSTASH_REDIS_REST_URL    # free Upstash Redis — keeps saved positions across restarts
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: VOICE_READY_TIMEOUT_MS   # how long to wait for Discord's voice handshake
        value: "60000"
